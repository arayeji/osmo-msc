# Sidecar beside osmo-msc. Does not insert into SQL.
# Only rotated files matching csv-pattern are encoded (not the live .cdr).
csv-dir /var/log
csv-pattern osmo-msc.cdr.*
output-dir /var/lib/osmocom/huawei-cdr
done-dir /var/log/osmo-msc-cdr-done
recording-entity 0000
file-prefix bA
timezone 2b0000
poll-seconds 10
route 00 INTL
route 09 ONNET
